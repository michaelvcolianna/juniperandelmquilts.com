<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />

		<!-- Bunny Fonts: a privacy-respecting Google Fonts proxy, consistent with the
		     site's no-tracking posture. Carried over from the Nuxt build. -->
		<link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.bunny.net/css?family=newsreader:300,400,500|inter:400,400i,500,600&display=swap"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
