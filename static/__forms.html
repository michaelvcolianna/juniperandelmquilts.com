<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Netlify form detection</title>
		<meta name="robots" content="noindex" />
	</head>
	<body>
		<!--
			Netlify discovers forms by parsing static HTML at deploy time. SvelteKit
			renders pages through a function, so its markup is not available to that
			parser and the site's own routes cannot be used for detection.

			This file is the skeleton Netlify parses, and the endpoint the real forms
			POST to. Every `name` here must match the live form exactly — a mismatch
			means submissions are silently dropped.

			Source of truth:
			  contact  -> src/routes/contact/+page.svelte
		-->
		<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="contact" />
			<input type="text" name="bot-field" />
			<input type="text" name="firstName" />
			<input type="text" name="lastName" />
			<input type="email" name="email" />
			<textarea name="message"></textarea>
		</form>
	</body>
</html>
